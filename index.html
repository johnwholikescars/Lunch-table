<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Lunch Table</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f172a;
    color: white;
    scroll-behavior: smooth;
}

/* HEADER */
header {
    text-align: center;
    padding: 80px 20px 40px;
}

h1 {
    font-size: 48px;
    margin-bottom: 20px;
}

/* BUTTONS */
.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #1e293b;
    color: white;
}

button:hover {
    background: #334155;
}

/* SECTIONS */
section {
    padding: 100px 20px;
    max-width: 800px;
    margin: auto;
    text-align: center;
}

h2 {
    font-size: 34px;
    margin-bottom: 15px;
}

/* CARD STYLE FOR MEMBERS */
.card {
    background: #1e293b;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
    <h1>Our Lunch Table</h1>

    <div class="buttons">
        <button onclick="go('about')">About</button>
        <button onclick="go('members')">Our Members</button>
    </div>
</header>

<section id="about">
    <h2>About</h2>
    <p>
        Welcome to our lunch table website. This is where we share info about our group,
        jokes, memories, and whatever else we want.
    </p>
</section>

<section id="members">
    <h2>Our Members</h2>

    <div class="card">Member 1</div>
    <div class="card">Member 2</div>
    <div class="card">Member 3</div>
</section>

<script>
function go(id) {
    document.getElementById(id).scrollIntoView({ behavior: "smooth" });
}
</script>

</body>
</html>
